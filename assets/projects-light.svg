<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" role="img" font-family="Segoe UI, system-ui, sans-serif" font-style="normal">
  <title>Two featured projects — Banking Session Management and E-commerce Lead Generation</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2fb"/>
      <stop offset="1" stop-color="#e2e8f5"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#93c5fd" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#93c5fd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c4b5fd" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#c4b5fd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <filter id="btnBlur" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <style>
    .card1 { animation: float1 10s ease-in-out infinite; }
    .card2 { animation: float2 12s ease-in-out infinite; }
    .btnGlow { animation: glowPulse 3.2s ease-in-out infinite; }
    .rise { animation: rise 1s ease-out both; }
    @keyframes float1 { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes float2 { 0%,100% { transform: translateY(0); } 50% { transform: translateY(5px); } }
    @keyframes glowPulse { 0%,100% { opacity:.4; } 50% { opacity:.85; } }
    @keyframes rise { from { opacity:0; transform: translateY(16px); } to { opacity:1; transform: translateY(0); } }
  </style>

  <rect width="1100" height="680" fill="url(#bg)"/>
  <circle cx="200" cy="350" r="230" fill="url(#glowA)" filter="url(#blur)"/>
  <circle cx="900" cy="320" r="240" fill="url(#glowB)" filter="url(#blur)"/>

  <g class="card1" filter="url(#cardShadow)">
    <rect x="23" y="158" width="500" height="430" rx="22" fill="#0f172a" opacity="0.10"/>
    <rect x="25" y="150" width="500" height="430" rx="22" fill="url(#cardFill)"/>
    <rect x="25" y="150" width="500" height="5" rx="2.5" fill="url(#accent)"/>
    <rect x="25" y="150" width="500" height="430" rx="22" fill="none" stroke="#d7e0f0" stroke-width="1"/>

    <text x="275" y="206" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Banking Session Management</text>
    <line x1="65" y1="224" x2="485" y2="224" stroke="#2563eb" stroke-opacity="0.4" stroke-width="2"/>
    <text x="275" y="248" text-anchor="middle" font-size="15" fill="#2563eb">Python Session System — Security-Focused</text>

    <text x="88" y="282" font-size="16" fill="#334155">•  Password hashing</text>
    <text x="88" y="309" font-size="16" fill="#334155">•  Secure session tokens</text>
    <text x="88" y="336" font-size="16" fill="#334155">•  AES-encrypted session storage</text>
    <text x="88" y="363" font-size="16" fill="#334155">•  Session expiration · limits · lockout</text>
    <text x="88" y="390" font-size="16" fill="#334155">•  CLI interface</text>

    <rect x="89" y="430" width="120" height="26" rx="13" fill="#f1f5ff" stroke="#c7d6ee"/>
    <text x="149" y="448" text-anchor="middle" font-size="12" fill="#334155">Automated testing</text>
    <rect x="217" y="430" width="116" height="26" rx="13" fill="#f1f5ff" stroke="#c7d6ee"/>
    <text x="275" y="448" text-anchor="middle" font-size="12" fill="#334155">100% coverage</text>
    <rect x="341" y="430" width="120" height="26" rx="13" fill="#f1f5ff" stroke="#c7d6ee"/>
    <text x="401" y="448" text-anchor="middle" font-size="12" fill="#334155">Security-first</text>

    <text x="275" y="486" text-anchor="middle" font-size="15" fill="#64748b">Python · Hashing · AES · CLI · Pytest</text>

    <rect class="btnGlow" x="175" y="502" width="200" height="44" rx="22" fill="url(#btnGrad)" filter="url(#btnBlur)"/>
    <rect x="175" y="502" width="200" height="44" rx="22" fill="url(#btnGrad)"/>
    <text x="275" y="529" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff">View Repo  →</text>
  </g>

  <g class="card2" filter="url(#cardShadow)" style="animation-delay:.8s">
    <rect x="573" y="158" width="500" height="430" rx="22" fill="#0f172a" opacity="0.10"/>
    <rect x="575" y="150" width="500" height="430" rx="22" fill="url(#cardFill)"/>
    <rect x="575" y="150" width="500" height="5" rx="2.5" fill="url(#accent)"/>
    <rect x="575" y="150" width="500" height="430" rx="22" fill="none" stroke="#d7e0f0" stroke-width="1"/>

    <text x="825" y="206" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">E-commerce Lead Generation</text>
    <line x1="615" y1="224" x2="1035" y2="224" stroke="#2563eb" stroke-opacity="0.4" stroke-width="2"/>
    <text x="825" y="248" text-anchor="middle" font-size="15" fill="#2563eb">AI-Powered Lead Generation &amp; Qualification</text>

    <text x="638" y="282" font-size="16" fill="#334155">•  AI-assisted business research</text>
    <text x="638" y="309" font-size="16" fill="#334155">•  Lead qualification &amp; scoring</text>
    <text x="638" y="336" font-size="16" fill="#334155">•  Confidence levels · duplicate detection</text>
    <text x="638" y="363" font-size="16" fill="#334155">•  Platform identification</text>
    <text x="638" y="390" font-size="16" fill="#334155">•  CLI workflow</text>

    <rect x="685" y="430" width="144" height="26" rx="13" fill="#f1f5ff" stroke="#c7d6ee"/>
    <text x="757" y="448" text-anchor="middle" font-size="12" fill="#334155">No fabricated leads</text>
    <rect x="837" y="430" width="128" height="26" rx="13" fill="#f1f5ff" stroke="#c7d6ee"/>
    <text x="901" y="448" text-anchor="middle" font-size="12" fill="#334155">Evidence-based</text>

    <text x="825" y="486" text-anchor="middle" font-size="15" fill="#64748b">Python · AI · APIs · CLI</text>

    <rect class="btnGlow" x="725" y="502" width="200" height="44" rx="22" fill="url(#btnGrad)" filter="url(#btnBlur)" style="animation-delay:.5s"/>
    <rect x="725" y="502" width="200" height="44" rx="22" fill="url(#btnGrad)"/>
    <text x="825" y="529" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff">View Repo  →</text>
  </g>
</svg>