<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" role="img" font-family="Segoe UI, system-ui, sans-serif" font-style="normal">
  <title>Journey from Learner to Agentic AI and Automation Engineer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nodeFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202b47"/>
      <stop offset="1" stop-color="#141d36"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="nodeBlur" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <style>
    .dot { animation: pulse .5s ease-out; }
    .ring { animation: ring 4.5s ease-in-out infinite; }
    .goalBlur { animation: goalGlow 3s ease-in-out infinite; }
    .fade { animation: rise 1.1s ease-out both; }
    @keyframes ring { 0%,100% { opacity:.5; } 50% { opacity:.95; } }
    @keyframes goalGlow { 0%,100% { opacity:.35; } 50% { opacity:.8; } }
    @keyframes rise { from { opacity:0; transform: translateY(14px); } to { opacity:1; transform: translateY(0); } }
  </style>

  <rect width="1100" height="360" fill="url(#bg)"/>
  <circle cx="980" cy="180" r="260" fill="url(#glow)" filter="url(#blur)"/>

  <path id="p0" d="M205 206 H250" fill="none"/>
  <path id="p1" d="M420 206 H465" fill="none"/>
  <path id="p2" d="M635 206 H680" fill="none"/>
  <path id="p3" d="M850 206 H895" fill="none"/>

  <line x1="205" y1="206" x2="250" y2="206" stroke="#475569" stroke-width="2"/>
  <line x1="420" y1="206" x2="465" y2="206" stroke="#475569" stroke-width="2"/>
  <line x1="635" y1="206" x2="680" y2="206" stroke="#475569" stroke-width="2"/>
  <line x1="850" y1="206" x2="895" y2="206" stroke="#475569" stroke-width="2"/>

  <polyline points="247,200 253,206 247,212" fill="none" stroke="#64748b" stroke-width="2"/>
  <polyline points="462,200 468,206 462,212" fill="none" stroke="#64748b" stroke-width="2"/>
  <polyline points="677,200 683,206 677,212" fill="none" stroke="#64748b" stroke-width="2"/>
  <polyline points="892,200 898,206 892,212" fill="none" stroke="#64748b" stroke-width="2"/>

  <circle class="ring" r="4.5" fill="#60a5fa"><animateMotion dur="3.6s" repeatCount="indefinite"><mpath href="#p0"/></animateMotion></circle>
  <circle class="ring" r="4.5" fill="#60a5fa"><animateMotion dur="3.6s" begin=".9s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
  <circle class="ring" r="4.5" fill="#60a5fa"><animateMotion dur="3.6s" begin="1.8s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
  <circle class="ring" r="4.5" fill="#a78bfa"><animateMotion dur="3.6s" begin="2.7s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>

  <g class="fade">
    <rect x="35" y="150" width="170" height="112" rx="18" fill="url(#nodeFill)" stroke="#334155"/>
    <rect x="35" y="150" width="170" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="120" y="180" text-anchor="middle" font-size="11" fill="#64748b" letter-spacing="3">01</text>
    <text x="120" y="210" text-anchor="middle" font-size="16" font-weight="700" fill="#f1f5f9">Learner</text>
    <text x="120" y="246" text-anchor="middle" font-size="11.5" fill="#8ea0bd">learning by building</text>
  </g>

  <g class="fade" style="animation-delay:.15s">
    <rect x="250" y="150" width="170" height="112" rx="18" fill="url(#nodeFill)" stroke="#334155"/>
    <rect x="250" y="150" width="170" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="335" y="180" text-anchor="middle" font-size="11" fill="#64748b" letter-spacing="3">02</text>
    <text x="335" y="210" text-anchor="middle" font-size="16" font-weight="700" fill="#f1f5f9">Python &amp; Software</text>
    <text x="335" y="230" text-anchor="middle" font-size="16" font-weight="700" fill="#f1f5f9">Engineering</text>
    <text x="335" y="250" text-anchor="middle" font-size="10.5" fill="#8ea0bd">Git · GitHub · VS Code</text>
  </g>

  <g class="fade" style="animation-delay:.3s">
    <rect x="465" y="150" width="170" height="112" rx="18" fill="url(#nodeFill)" stroke="#334155"/>
    <rect x="465" y="150" width="170" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="550" y="180" text-anchor="middle" font-size="11" fill="#64748b" letter-spacing="3">03</text>
    <text x="550" y="210" text-anchor="middle" font-size="16" font-weight="700" fill="#f1f5f9">Agentic AI &amp;</text>
    <text x="550" y="230" text-anchor="middle" font-size="16" font-weight="700" fill="#f1f5f9">Automation</text>
    <text x="550" y="250" text-anchor="middle" font-size="10.5" fill="#8ea0bd">Agents SDK · ADK · MCP</text>
  </g>

  <g class="fade" style="animation-delay:.45s">
    <rect x="680" y="150" width="170" height="112" rx="18" fill="url(#nodeFill)" stroke="#334155"/>
    <rect x="680" y="150" width="170" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="765" y="180" text-anchor="middle" font-size="11" fill="#64748b" letter-spacing="3">04</text>
    <text x="765" y="210" text-anchor="middle" font-size="16" font-weight="700" fill="#f1f5f9">Data Science</text>
    <text x="765" y="230" text-anchor="middle" font-size="16" font-weight="700" fill="#f1f5f9">(MS)</text>
    <text x="765" y="250" text-anchor="middle" font-size="11.5" fill="#8ea0bd">planned after BS</text>
  </g>

  <g class="fade" style="animation-delay:.6s">
    <rect class="goalBlur" x="880" y="140" width="170" height="132" rx="22" fill="url(#accent)" filter="url(#nodeBlur)"/>
    <rect x="895" y="150" width="170" height="112" rx="18" fill="url(#nodeFill)" stroke="#a78bfa" stroke-width="1.5"/>
    <rect x="895" y="150" width="170" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="980" y="180" text-anchor="middle" font-size="11" fill="#c4b5fd" letter-spacing="3">05</text>
    <text x="980" y="210" text-anchor="middle" font-size="16" font-weight="700" fill="#f1f5f9">Agentic AI /</text>
    <text x="980" y="230" text-anchor="middle" font-size="16" font-weight="700" fill="#f1f5f9">Automation Engineer</text>
    <text x="980" y="250" text-anchor="middle" font-size="11.5" fill="#8ea0bd">working toward this</text>
  </g>
</svg>