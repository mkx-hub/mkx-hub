<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 250" role="img" font-family="Segoe UI, system-ui, sans-serif" font-style="normal">
  <title>Journey — Student, Python &amp; Software Engineering, AI Agents &amp; Automation, Data Science, AI / Agent Engineering (goal)</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
  </defs>

  <style>
    .ring { animation: ring 4.5s ease-in-out infinite; }
    .fade { animation: rise 1s ease-out both; }
    @keyframes ring { 0%,100% { opacity:.45; } 50% { opacity:1; } }
    @keyframes rise { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform: translateY(0); } }
  </style>

  <path id="p0" d="M205 125 H250" fill="none"/>
  <path id="p1" d="M420 125 H465" fill="none"/>
  <path id="p2" d="M635 125 H680" fill="none"/>
  <path id="p3" d="M850 125 H895" fill="none"/>

  <line x1="205" y1="125" x2="250" y2="125" stroke="#30363d" stroke-width="2"/>
  <line x1="420" y1="125" x2="465" y2="125" stroke="#30363d" stroke-width="2"/>
  <line x1="635" y1="125" x2="680" y2="125" stroke="#30363d" stroke-width="2"/>
  <line x1="850" y1="125" x2="895" y2="125" stroke="#30363d" stroke-width="2"/>

  <polyline points="247,119 253,125 247,131" fill="none" stroke="#6e7681" stroke-width="2"/>
  <polyline points="462,119 468,125 462,131" fill="none" stroke="#6e7681" stroke-width="2"/>
  <polyline points="677,119 683,125 677,131" fill="none" stroke="#6e7681" stroke-width="2"/>
  <polyline points="892,119 898,125 892,131" fill="none" stroke="#6e7681" stroke-width="2"/>

  <circle class="ring" r="4" fill="#58a6ff"><animateMotion dur="3.6s" repeatCount="indefinite"><mpath href="#p0"/></animateMotion></circle>
  <circle class="ring" r="4" fill="#58a6ff"><animateMotion dur="3.6s" begin=".9s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
  <circle class="ring" r="4" fill="#58a6ff"><animateMotion dur="3.6s" begin="1.8s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
  <circle class="ring" r="4" fill="#a371f7"><animateMotion dur="3.6s" begin="2.7s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>

  <g class="fade">
    <rect x="35" y="70" width="170" height="110" rx="8" fill="#161b22" stroke="#30363d"/>
    <rect x="35" y="70" width="170" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="120" y="100" text-anchor="middle" font-size="11" fill="#6e7681" letter-spacing="3">01</text>
    <text x="120" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#f0f6fc">Student</text>
    <text x="120" y="168" text-anchor="middle" font-size="11.5" fill="#8b949e">learning by building</text>
  </g>

  <g class="fade" style="animation-delay:.15s">
    <rect x="250" y="70" width="170" height="110" rx="8" fill="#161b22" stroke="#30363d"/>
    <rect x="250" y="70" width="170" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="335" y="100" text-anchor="middle" font-size="11" fill="#6e7681" letter-spacing="3">02</text>
    <text x="335" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#f0f6fc">Python &amp; Software</text>
    <text x="335" y="148" text-anchor="middle" font-size="16" font-weight="700" fill="#f0f6fc">Engineering</text>
    <text x="335" y="168" text-anchor="middle" font-size="10.5" fill="#8b949e">Git · GitHub · VS Code</text>
  </g>

  <g class="fade" style="animation-delay:.3s">
    <rect x="465" y="70" width="170" height="110" rx="8" fill="#161b22" stroke="#30363d"/>
    <rect x="465" y="70" width="170" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="550" y="100" text-anchor="middle" font-size="11" fill="#6e7681" letter-spacing="3">03</text>
    <text x="550" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#f0f6fc">AI Agents &amp;</text>
    <text x="550" y="148" text-anchor="middle" font-size="16" font-weight="700" fill="#f0f6fc">Automation</text>
    <text x="550" y="168" text-anchor="middle" font-size="10.5" fill="#8b949e">Agents SDK · ADK · MCP</text>
  </g>

  <g class="fade" style="animation-delay:.45s">
    <rect x="680" y="70" width="170" height="110" rx="8" fill="#161b22" stroke="#30363d"/>
    <rect x="680" y="70" width="170" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="765" y="100" text-anchor="middle" font-size="11" fill="#6e7681" letter-spacing="3">04</text>
    <text x="765" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#f0f6fc">Data Science</text>
    <text x="765" y="168" text-anchor="middle" font-size="11.5" fill="#8b949e">future MS — after BS</text>
  </g>

  <g class="fade" style="animation-delay:.6s">
    <rect x="895" y="70" width="170" height="110" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
    <rect x="895" y="70" width="170" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="980" y="100" text-anchor="middle" font-size="11" fill="#a371f7" letter-spacing="3">05 · GOAL</text>
    <text x="980" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#f0f6fc">AI / Agent</text>
    <text x="980" y="148" text-anchor="middle" font-size="16" font-weight="700" fill="#f0f6fc">Engineering</text>
    <text x="980" y="168" text-anchor="middle" font-size="11.5" fill="#8b949e">career goal</text>
  </g>
</svg>