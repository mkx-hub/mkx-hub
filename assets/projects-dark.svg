  <g>
    <rect x="555" y="20" width="520" height="410" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <rect x="555" y="20" width="520" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="815" y="62" text-anchor="middle" font-size="23" font-weight="700" fill="#f0f6fc">E-commerce Lead Generation</text>
    <line x1="575" y1="78" x2="1055" y2="78" stroke="#30363d" stroke-width="1"/>
    <text x="815" y="104" text-anchor="middle" font-size="14" fill="#58a6ff">AI agent project — research, scoring, qualification</text>
    <text x="588" y="138" font-size="15" fill="#c9d1d9">•  AI-assisted business research</text>
