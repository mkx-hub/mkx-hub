    <text x="285" y="62" text-anchor="middle" font-size="23" font-weight="700" fill="#f0f6fc">Banking Session Management</text>
    <line x1="45" y1="78" x2="525" y2="78" stroke="#30363d" stroke-width="1"/>
    <text x="285" y="104" text-anchor="middle" font-size="14" fill="#58a6ff">Practical Python security — session management</text>
    <text x="58" y="138" font-size="15" fill="#c9d1d9">•  bcrypt password hashing</text>
    <text x="58" y="165" font-size="15" fill="#c9d1d9">•  AES-256-GCM encrypted session storage</text>
    <text x="58" y="192" font-size="15" fill="#c9d1d9">•  Idle &amp; absolute session timeouts</text>
    <text x="58" y="219" font-size="15" fill="#c9d1d9">•  Max sessions · eviction · lockout</text>
    <text x="58" y="246" font-size="15" fill="#c9d1d9">•  CLI · security logging</text>
    <rect x="106" y="286" width="118" height="26" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="165" y="304" text-anchor="middle" font-size="11" fill="#8b949e">Automated tests</text>
