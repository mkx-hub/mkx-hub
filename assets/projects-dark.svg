    <text x="288" y="304" text-anchor="middle" font-size="11" fill="#8b949e">High coverage</text>
    <rect x="352" y="286" width="112" height="26" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="408" y="304" text-anchor="middle" font-size="11" fill="#8b949e">Security-first</text>
    <text x="285" y="346" text-anchor="middle" font-size="14" fill="#8b949e">Python · bcrypt · AES-256-GCM · pytest</text>
    <rect x="195" y="366" width="180" height="42" rx="6" fill="#238636"/>
    <text x="285" y="393" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">View Repo</text>
