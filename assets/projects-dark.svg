<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" role="img" font-family="Segoe UI, system-ui, sans-serif" font-style="normal">
  <title>Two featured projects — Banking Session Management and E-commerce Lead Generation</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#238636"/>
      <stop offset="1" stop-color="#2ea043"/>
    </linearGradient>
  </defs>

  <g>
    <rect x="25" y="20" width="520" height="410" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
