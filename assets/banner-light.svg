<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 250" role="img" font-family="Segoe UI, system-ui, sans-serif" font-style="normal">
  <title>Muhammad Khan — Student building toward AI &amp; Agent Engineering</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2fb"/>
      <stop offset="1" stop-color="#f8faff"/>
    </linearGradient>
  </defs>

  <style>
    .fade { animation: rise 1.2s ease-out both; }
    .fade2 { animation: rise 1.2s 0.25s ease-out both; }
    .fade3 { animation: rise 1.2s 0.45s ease-out both; }
    @keyframes rise { from { opacity:0; transform: translateY(14px); } to { opacity:1; transform: translateY(0); } }
  </style>

  <rect width="1100" height="250" fill="url(#bg)"/>

  <text class="fade" x="550" y="120" text-anchor="middle" font-size="60" font-weight="700" fill="#0f172a" letter-spacing="1.5">Muhammad Khan</text>
  <text class="fade2" x="550" y="174" text-anchor="middle" font-size="26" font-weight="500" fill="#2563eb" letter-spacing="0.5">Student building toward AI &amp; Agent Engineering</text>
  <text class="fade3" x="550" y="212" text-anchor="middle" font-size="16" fill="#64748b" letter-spacing="2">Python • AI Agents • Automation</text>
</svg>